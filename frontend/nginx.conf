server {
    listen 80;
    server_name localhost;

    # Root directory for static production React assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Handle React SPA client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy API requests to the Spring Boot backend container
    location /api/ {
        proxy_pass http://springboot-backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 15s;
        proxy_read_timeout 60s;
    }

    # Reverse proxy Spring Boot Actuator health checks
    location /actuator/ {
        proxy_pass http://springboot-backend:8080/actuator/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Health check for Nginx itself
    location /health {
        access_log off;
        return 200 "frontend-healthy\n";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
