services:
  - type: web
    name: smart-citizen-api
    runtime: docker
    plan: free
    dockerfilePath: ./springboot-app/Dockerfile
    dockerContext: ./springboot-app
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SPRING_FLYWAY_USER
        sync: false
      - key: SPRING_FLYWAY_PASSWORD
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      - key: SPRING_FLYWAY_ENABLED
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PROVISION_KEY
        generateValue: true
      - key: DEMO_ACCOUNTS_ENABLED
        value: "false"
      - key: JAVA_OPTS
        value: "-XX:MaxRAMPercentage=65 -XX:+UseSerialGC"

  - type: web
    name: smart-citizen-portal
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: smart-citizen-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
