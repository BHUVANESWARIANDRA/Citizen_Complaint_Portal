apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-service
  namespace: smart-citizen
  labels:
    app: flask-service
    tier: microservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-service
  template:
    metadata:
      labels:
        app: flask-service
        tier: microservice
    spec:
      containers:
        - name: flask-app
          image: smartcitizen/flask-service:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
              name: http
          envFrom:
            - configMapRef:
                name: smart-citizen-config
          volumeMounts:
            - name: flask-storage
              mountPath: /app/data
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - name: flask-storage
          persistentVolumeClaim:
            claimName: flask-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: smart-citizen
  labels:
    app: flask-service
    tier: microservice
spec:
  type: ClusterIP
  ports:
    - port: 5000
      targetPort: 5000
      protocol: TCP
      name: http
  selector:
    app: flask-service
