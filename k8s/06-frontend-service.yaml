apiVersion: v1
kind: Service
metadata:
  name: react-frontend
  namespace: smart-citizen
  labels:
    app: react-frontend
    tier: frontend
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
      protocol: TCP
      name: http
  selector:
    app: react-frontend
