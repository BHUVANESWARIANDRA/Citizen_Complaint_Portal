apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: h2-data-pvc
  namespace: smart-citizen
  labels:
    app.kubernetes.io/name: springboot-backend
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: flask-data-pvc
  namespace: smart-citizen
  labels:
    app.kubernetes.io/name: flask-service
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 500Mi
