# Test Profile Properties using in-memory H2
spring.application.name=smart-citizen-complaint-portal-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Security & JWT Configuration for Tests
security.jwt.secret=test-smart-citizen-super-secure-jwt-secret-key-2026-very-long-random-string
security.jwt.expiration-seconds=86400
admin.provision.key=SmartCitizenAdmin2026!SecureKey

