# Spring Boot Application Configuration (Configured to port 8081 to prevent conflict with Oracle on 8080)
spring.application.name=smart-citizen-complaint-portal
server.port=8081

# H2 File-Based Persistent Storage for Local Runs
spring.datasource.url=jdbc:h2:file:./data/complaintsdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Web Console Configuration (Useful for B.Tech Lab Demonstrations)
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Actuator Endpoints for DevOps Health Checking & Docker/K8s Probes
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# Logging Configuration
logging.level.com.smartcitizen=INFO
logging.level.org.springframework.web=INFO

# Security & JWT Configuration
security.jwt.secret=${JWT_SECRET:}
security.jwt.expiration-seconds=86400

# Administrator Provisioning Security Key
admin.provision.key=${ADMIN_PROVISION_KEY:}

# Demo municipal credentials are seeded only when explicitly enabled.
demo.accounts.enabled=${DEMO_ACCOUNTS_ENABLED:false}
